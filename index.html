<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>AI VR Smart Home</title>

<style>

html,body{
    margin:0;
    overflow:hidden;
    background:#000;
    font-family:Arial;
}

canvas{
    display:block;
}

#hud{
    position:absolute;
    top:20px;
    left:20px;
    z-index:100;
    color:white;
    background:rgba(0,0,0,0.4);
    padding:20px;
    border-radius:20px;
    backdrop-filter:blur(20px);
    border:1px solid rgba(0,255,255,0.3);
}

.button{
    margin-top:10px;
    padding:10px 20px;
    border-radius:10px;
    border:none;
    background:rgba(0,255,255,0.2);
    color:white;
    cursor:pointer;
}

</style>
</head>

<body>

<div id="hud">

<h2>AI 智能家居 VR 系统</h2>

<div>黄金比例墙面：390cm × 260cm</div>

<button class="button" id="dayNight">
昼夜切换
</button>

<button class="button" id="materialBtn">
切换岩板 / 木饰面
</button>

<button class="button" id="voiceBtn">
AI语音控制
</button>

<button class="button" id="musicBtn">
音乐灯光联动
</button>

</div>

<script type="module">

import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160/build/three.module.js';

import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.160/examples/jsm/controls/OrbitControls.js';

import { VRButton } from 'https://cdn.jsdelivr.net/npm/three@0.160/examples/jsm/webxr/VRButton.js';

import { RGBELoader } from 'https://cdn.jsdelivr.net/npm/three@0.160/examples/jsm/loaders/RGBELoader.js';

import { EffectComposer } from 'https://cdn.jsdelivr.net/npm/three@0.160/examples/jsm/postprocessing/EffectComposer.js';

import { RenderPass } from 'https://cdn.jsdelivr.net/npm/three@0.160/examples/jsm/postprocessing/RenderPass.js';

import { UnrealBloomPass } from 'https://cdn.jsdelivr.net/npm/three@0.160/examples/jsm/postprocessing/UnrealBloomPass.js';

let scene = new THREE.Scene();

let camera = new THREE.PerspectiveCamera(
    75,
    window.innerWidth/window.innerHeight,
    0.1,
    1000
);

camera.position.set(0,1.5,5);

let renderer = new THREE.WebGLRenderer({
    antialias:true
});

renderer.setSize(window.innerWidth,window.innerHeight);

renderer.shadowMap.enabled = true;

renderer.xr.enabled = true;

renderer.toneMapping = THREE.ACESFilmicToneMapping;

renderer.outputColorSpace = THREE.SRGBColorSpace;

document.body.appendChild(renderer.domElement);

document.body.appendChild(VRButton.createButton(renderer));

let controls = new OrbitControls(
    camera,
    renderer.domElement
);

controls.enableDamping = true;

//////////////////////////////////////////
// HDR 环境光
//////////////////////////////////////////

new RGBELoader()
.load(
'https://dl.polyhaven.org/file/ph-assets/HDRIs/hdr/1k/studio_small_09_1k.hdr',
function(texture){

texture.mapping = THREE.EquirectangularReflectionMapping;

scene.environment = texture;

scene.background = texture;

}
);

//////////////////////////////////////////
// Unreal Engine级 Bloom
//////////////////////////////////////////

let composer = new EffectComposer(renderer);

composer.addPass(
    new RenderPass(scene,camera)
);

composer.addPass(
    new UnrealBloomPass(
        new THREE.Vector2(
            window.innerWidth,
            window.innerHeight
        ),
        1.5,
        0.4,
        0.85
    )
);

//////////////////////////////////////////
// 地面
//////////////////////////////////////////

let floor = new THREE.Mesh(

new THREE.PlaneGeometry(20,20),

new THREE.MeshPhysicalMaterial({
    color:0x111111,
    metalness:1,
    roughness:0.1,
    clearcoat:1
})

);

floor.rotation.x = -Math.PI/2;

floor.receiveShadow = true;

scene.add(floor);

//////////////////////////////////////////
// 黄金比例墙面
//////////////////////////////////////////

const widths = [
0.928,
0.574,
1.896,
0.574,
0.928
];

let startX = -2.45;

let wallMaterial = new THREE.MeshPhysicalMaterial({

color:0x666666,

metalness:0.9,

roughness:0.15,

clearcoat:1

});

widths.forEach((w,i)=>{

let wall = new THREE.Mesh(

new THREE.BoxGeometry(w,2.6,0.08),

wallMaterial

);

wall.position.set(
startX + w/2,
1.3,
-3
);

wall.castShadow = true;

scene.add(wall);

startX += w;

});

//////////////////////////////////////////
// OLED电视墙
//////////////////////////////////////////

const video = document.createElement('video');

video.src = 'demo.mp4';

video.loop = true;

video.muted = true;

video.play();

const videoTexture =
new THREE.VideoTexture(video);

let tv = new THREE.Mesh(

new THREE.PlaneGeometry(1.5,0.8),

new THREE.MeshBasicMaterial({
    map:videoTexture
})

);

tv.position.set(0,1.4,-2.9);

scene.add(tv);

//////////////////////////////////////////
// AI灯光
//////////////////////////////////////////

let light = new THREE.PointLight(
0x00ffff,
3,
20
);

light.position.set(0,3,2);

scene.add(light);

//////////////////////////////////////////
// 昼夜切换
//////////////////////////////////////////

let day = true;

document.getElementById('dayNight')
.onclick = ()=>{

day = !day;

if(day){

scene.backgroundIntensity = 1;

light.color.set(0xffffff);

}else{

scene.backgroundIntensity = 0.2;

light.color.set(0x00aaff);

}

};

//////////////////////////////////////////
// 材质切换
//////////////////////////////////////////

let wood = false;

document.getElementById('materialBtn')
.onclick = ()=>{

wood = !wood;

if(wood){

wallMaterial.color.set(0x8b5a2b);

wallMaterial.roughness = 0.7;

}else{

wallMaterial.color.set(0x666666);

wallMaterial.roughness = 0.15;

}

};

//////////////////////////////////////////
// AI语音控制
//////////////////////////////////////////

document.getElementById('voiceBtn')
.onclick = ()=>{

const recognition =
new webkitSpeechRecognition();

recognition.lang='zh-CN';

recognition.start();

recognition.onresult=(e)=>{

let cmd =
e.results[0][0].transcript;

if(cmd.includes('打开夜晚')){

light.color.set(0x0066ff);

}

if(cmd.includes('打开白天')){

light.color.set(0xffffff);

}

};

};

//////////////////////////////////////////
// 音乐灯光联动
//////////////////////////////////////////

document.getElementById('musicBtn')
.onclick = ()=>{

const audio = new Audio('music.mp3');

const ctx =
new AudioContext();

const src =
ctx.createMediaElementSource(audio);

const analyser =
ctx.createAnalyser();

src.connect(analyser);

analyser.connect(ctx.destination);

audio.play();

let data =
new Uint8Array(
analyser.frequencyBinCount
);

function musicLoop(){

analyser.getByteFrequencyData(data);

let avg =
data.reduce((a,b)=>a+b)/data.length;

light.intensity =
avg/25;

requestAnimationFrame(musicLoop);

}

musicLoop();

};

//////////////////////////////////////////
// 动画循环
//////////////////////////////////////////

renderer.setAnimationLoop(()=>{

controls.update();

light.position.x =
Math.sin(Date.now()*0.001)*3;

composer.render();

});

//////////////////////////////////////////

window.addEventListener(
'resize',
()=>{

camera.aspect =
window.innerWidth/window.innerHeight;

camera.updateProjectionMatrix();

renderer.setSize(
window.innerWidth,
window.innerHeight
);

composer.setSize(
window.innerWidth,
window.innerHeight
);

}
);

</script>

</body>
</html>
